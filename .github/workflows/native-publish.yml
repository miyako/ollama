name: Publish native Ollama release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Exact native release tag of the existing unpublished draft'
        type: string
        required: true
      source_run_id:
        description: 'Original failed main publication run (all builds must have passed)'
        type: string
        required: true
      draft_release_id:
        description: 'Existing draft ID to verify and publish WITHOUT replacing any assets'
        type: string
        required: true
  workflow_call:
    inputs:
      release_tag:
        type: string
        required: true

permissions:
  actions: read
  contents: read

concurrency:
  group: native-publish-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'miyako/ollama' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run_id || github.run_id }}
          pattern: native-*
          path: .build/downloads
      - name: Publish new immutable native release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          RESUME_DRAFT_ID: ${{ inputs.draft_release_id }}
        run: python scripts/native/publish.py
