theme: jekyll-theme-minimal

markdown: kramdown
kramdown:
  syntax_highlighter: rouge
highlighter: rouge
plugins_dir: _plugins
baseurl: /ollama

title: "Ollama"
description: "Local LLMs with Ollama. Run a local server or integrate it with 4D."
url: "https://miyako.github.io"
logo: "/assets/ollama.png"
component_version: "20.1.7"
show_downloads: false      # component releases are linked from the home page
github:
  is_user_page: true
  owner_url: "https://github.com/miyako"
  repository_url: "https://github.com/miyako/ollama"
  is_project_page: false

exclude:
  - ".build"
  - "scripts"
  - "vendor"
  - "resources"
  - "LICENSE"
  - "README.md"
  - "SITE-DESIGN.md"
  - "package.json"
  - "Gemfile"
